<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrivision | Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container register-container">
    <div class="auth-logo">🌱</div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">Start your smarter farming workspace in seconds</p>

    <div class="auth-card">
        <div id="registerError" class="agr-alert agr-error d-none" role="alert"></div>

        <form id="registerForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="first_name" class="form-label">First Name *</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Enter first name">
                </div>
                <div class="col-md-6">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Enter last name">
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username *</label>
                <div class="username-wrapper">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username">
                    <span id="usernameStatusIcon" class="username-status-icon"></span>
                </div>
                <div id="usernameStatusMessage" class="username-message"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com">
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="password" class="form-label">Password *</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Create password">
                        <button type="button" id="passwordToggle" class="password-toggle" aria-label="Toggle password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="confirm_password" class="form-label">Confirm Password *</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password">
                        <button type="button" id="confirmPasswordToggle" class="password-toggle" aria-label="Toggle confirm password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" id="registerButton" class="btn btn-agr w-100">
                Create Account →
            </button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
            Already have an account?
            <a href="login.html" class="agr-link">Sign in</a>
        </p>
    </div>

    <div class="auth-footer">
        <div class="brand">Agrivision</div>
        <div class="tagline"><a href="home.html" class="agr-link small">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>

</html>
