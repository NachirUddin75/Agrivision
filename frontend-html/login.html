<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Agrivision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-logo">🌱</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to your Agrivision workspace</p>

    <div class="auth-card">
        <div id="error-message" class="agr-alert agr-error d-none" role="alert"></div>
        <div id="success-message" class="agr-alert agr-success d-none" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Password</label>
                    <a href="forgot-password.html" class="agr-link small">Forgot password?</a>
                </div>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" id="toggle-password" class="password-toggle" aria-label="Toggle password visibility">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-button" class="btn btn-agr w-100 mt-2">
                <span id="login-button-text">Sign In</span>
                <span id="login-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <div class="text-center my-3 position-relative">
            <hr class="text-muted opacity-25">
            <span class="bg-white px-3 small text-muted position-relative" style="top: -28px;">or</span>
        </div>

        <a href="login-otp.html" class="btn btn-agr-outline w-100" style="margin-top: -16px;">
            <i class="bi bi-shield-lock"></i>
            Login with Email OTP
        </a>

        <p class="text-center small text-secondary mt-4 mb-0">
            Don't have an account?
            <a href="register.html" class="agr-link">Create one</a>
        </p>
    </div>

    <div class="auth-footer">
        <div class="brand">Agrivision</div>
        <div class="tagline"><a href="home.html" class="agr-link small">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>

</html>
