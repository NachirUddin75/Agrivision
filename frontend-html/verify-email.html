<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrivision | Verify Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-card text-center">
        <div id="verifyingState">
            <div class="status-icon email"><i class="bi bi-envelope-check"></i></div>
            <h1 class="h4 fw-bold mb-2">Verifying Your Email…</h1>
            <p class="text-secondary small mb-4">Please wait while we activate your Agrivision account.</p>
            <div class="agr-spinner mx-auto"></div>
        </div>

        <div id="successState" class="d-none">
            <div class="status-icon success"><i class="bi bi-check-lg"></i></div>
            <h1 class="h4 fw-bold mb-2">Email Verified!</h1>
            <p id="successMessage" class="text-secondary small mb-4">Your account is now active.</p>
            <a href="login.html" class="btn btn-agr w-100">Sign In to Your Account →</a>
        </div>

        <div id="errorState" class="d-none">
            <div class="status-icon error"><i class="bi bi-x-lg"></i></div>
            <h1 class="h4 fw-bold mb-2">Verification Failed</h1>
            <p id="errorMessage" class="text-secondary small mb-4">The verification link is invalid or expired.</p>
            <a href="login.html" class="btn btn-agr-outline w-100">Go to Sign In</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/verify-email.js"></script>
</body>

</html>
