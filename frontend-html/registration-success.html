<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrivision | Registration Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-card text-center">
        <div class="status-icon email"><i class="bi bi-envelope-paper"></i></div>
        <h1 class="h3 fw-bold mb-2">Check Your Email</h1>
        <p class="text-secondary small mb-4">
            We've sent a verification link to your email address. Click the link to activate your Agrivision account.
            (In local debug mode without Brevo, check the Django terminal for the verification link.)
        </p>
        <a href="login.html" class="btn btn-agr w-100">Go to Sign In →</a>
    </div>
</div>

</body>

</html>
