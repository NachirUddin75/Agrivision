<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrivision | Login with OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-logo"><i class="bi bi-shield-lock"></i></div>
    <h1 id="pageTitle" class="auth-title">Login with Email OTP</h1>
    <p id="pageSubtitle" class="auth-subtitle">Receive a one-time code to sign in securely</p>

    <div class="auth-card">
        <div id="otpError" class="agr-alert agr-error d-none" role="alert"></div>
        <div id="otpMessage" class="agr-alert agr-success d-none" role="alert"></div>

        <form id="usernameForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username or email">
            </div>
            <button type="submit" id="sendOtpButton" class="btn btn-agr w-100">
                Send OTP →
            </button>
        </form>

        <form id="otpForm" class="d-none">
            <div class="mb-3">
                <label class="form-label">Account</label>
                <div id="otpUsername" class="form-control bg-light d-flex align-items-center fw-semibold text-dark"></div>
            </div>
            <div class="mb-4">
                <label for="otp" class="form-label">6-Digit OTP</label>
                <input type="text" id="otp" class="form-control otp-input" maxlength="6" placeholder="000000">
            </div>
            <button type="submit" id="verifyOtpButton" class="btn btn-agr w-100 mb-2">
                Verify &amp; Sign In
            </button>
            <button type="button" id="changeUsernameButton" class="btn btn-agr-outline w-100">
                Use a Different Account
            </button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
            Prefer password? <a href="login.html" class="agr-link">Sign in with password</a>
        </p>
    </div>

    <div class="auth-footer">
        <div class="brand">Agrivision</div>
        <div class="tagline"><a href="home.html" class="agr-link small">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login-otp.js"></script>
</body>

</html>
