<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrivision | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">
    <div class="auth-logo"><i class="bi bi-key"></i></div>
    <h1 id="pageTitle" class="auth-title">Reset Password</h1>
    <p id="pageSubtitle" class="auth-subtitle">We will send an OTP to your registered email</p>

    <div class="auth-card">
        <div id="forgotError" class="agr-alert agr-error d-none" role="alert"></div>
        <div id="forgotMessage" class="agr-alert agr-success d-none" role="alert"></div>

        <form id="usernameForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username or email">
            </div>
            <button type="submit" id="requestOtpButton" class="btn btn-agr w-100">
                Send Reset OTP →
            </button>
        </form>

        <form id="otpForm" class="d-none">
            <div class="mb-3">
                <label for="otpUsername" class="form-label">Account</label>
                <input type="text" id="otpUsername" class="form-control bg-light" readonly>
            </div>
            <div class="mb-4">
                <label for="otp" class="form-label">6-Digit OTP</label>
                <input type="text" id="otp" class="form-control otp-input" maxlength="6" placeholder="000000">
            </div>
            <button type="submit" id="verifyOtpButton" class="btn btn-agr w-100 mb-2">
                Verify OTP
            </button>
            <button type="button" id="backToUsernameButton" class="btn btn-agr-outline w-100">
                Back
            </button>
        </form>

        <form id="passwordForm" class="d-none">
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password">
                    <button type="button" id="newPasswordToggle" class="password-toggle" aria-label="Toggle password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password">
                    <button type="button" id="confirmPasswordToggle" class="password-toggle" aria-label="Toggle password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" id="resetPasswordButton" class="btn btn-agr w-100 mb-2">
                Update Password
            </button>
            <button type="button" id="backToOtpButton" class="btn btn-agr-outline w-100">
                Back
            </button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
            Remembered it? <a href="login.html" class="agr-link">Back to Sign In</a>
        </p>
    </div>

    <div class="auth-footer">
        <div class="brand">Agrivision</div>
        <div class="tagline"><a href="home.html" class="agr-link small">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/forgot-password.js"></script>
</body>

</html>
